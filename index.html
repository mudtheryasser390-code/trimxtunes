<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Termux Web Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <style>
    body { background-color: #000; color: #fff; margin: 0; padding: 20px; }
    #terminal { width: 100%; height: 400px; }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <script>
    const term = new Terminal({ cursorBlink: true });
    term.open(document.getElementById('terminal'));
    term.writeln('Welcome to Termux Web Terminal!');
    term.write('$ ');
  </script>
</body>
</html>
<button onclick="navigator.clipboard.writeText('pkg update && pkg upgrade -y && termux-setup-storage')">نسخ أوامر تيرمكس</button>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أوامر تيرمكس</title>
</head>
<body>
    <h2>قائمة أوامر تيرمكس الأساسية</h2>
    <textarea id="termuxCommands" rows="10" cols="50" readonly>
pkg update && pkg upgrade -y
pkg install python git curl wget nano -y
termux-setup-storage
pkg install nodejs -y
pkg install php -y
    </textarea>
    <br>
    <button onclick="copyCommands()">نسخ جميع الأوامر</button>

    <script>
        function copyCommands() {
            var copyText = document.getElementById("termuxCommands");
            copyText.select();
            document.execCommand("copy");
            alert("تم نسخ الأوامر بنجاح!");
        }
    </script>
</body>
</html>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم تيرمكس</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background-color: #f4f4f9; }
        .btn { padding: 12px 24px; font-size: 16px; margin: 8px; cursor: pointer; border-radius: 8px; border: none; background-color: #007bff; color: white; }
        .btn:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <h1>لوحة تحكم تيرمكس</h1>
    
    <button class="btn" onclick="runCommand('pkg update && pkg upgrade -y')">تحديث المستودعات</button>
    <button class="btn" onclick="runCommand('pkg install python -y')">تثبيت بايثون</button>
    <button class="btn" onclick="runCommand('pkg install git -y')">تثبيت Git</button>
    <button class="btn" onclick="runCommand('pkg install curl -y')">تثبيت Curl</button>

    <script>
        function runCommand(cmd) {
            navigator.clipboard.writeText(cmd);
            alert('تم نسخ الأمر بنجاح! الصقه الآن في Termux:\n' + cmd);
        }
    </script>
</body>
</html>
<!DOCTYPE html>
<html lang="ar" dir="rtl">

</head>
<body>
    <h1>لوحة تحكم تيرمكس</h1>

    <button onclick="runCommand('pkg install python')">تثبيت بايثون</button>

        function runCommand(cmd) {
            alert('تم تشغيل الأمر: ' + cmd);
        }

</body>
</html>
