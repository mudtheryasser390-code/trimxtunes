<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أدوات تيرمكس</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        button { padding: 15px 30px; font-size: 16px; margin: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>لوحة تحكم تيرمكس</h1>
    <button onclick="runCommand('pkg update')">تحديث المستودعات</button>
    <button onclick="runCommand('pkg install python')">تثبيت بايثون</button>
    <script>
        function runCommand(cmd) {
            alert('تم تشغيل الأمر: ' + cmd);
        }
    </script>
</body>
</html>
